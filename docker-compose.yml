services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./outputs/models:/app/outputs/models
    environment:
      - MODEL_PATH=outputs/models/best_mobilenet_v2.pth
      - MODEL_TYPE=mobilenet_v2
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
